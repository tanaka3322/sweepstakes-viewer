<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f4ef">
<title>懸賞リスト（スマホ用）</title>
<style>
  :root{ --bg:#f6f4ef; --card:#fff; --ink:#22201c; --muted:#6f6a5e; --line:#e3ded2;
         --accent:#b3541e; --today:#c62828; --soon:#ef6c00; --ok:#2e7d32; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
        background:var(--bg); color:var(--ink); -webkit-text-size-adjust:100%; }
  header{ position:sticky; top:0; z-index:10; background:var(--bg); padding:10px 12px 6px;
          border-bottom:1px solid var(--line); }
  .headrow{ display:flex; align-items:center; gap:8px; }
  h1{ font-size:18px; margin:0; flex:1; }
  .refresh{ border:1px solid var(--line); background:var(--card); color:var(--ink);
            border-radius:999px; padding:7px 12px; font-size:13px; min-height:36px; }
  .refresh:active{ opacity:.7; }
  .meta{ font-size:12px; color:var(--muted); margin-top:3px; }
  /* ===== 応募キリ番カウンター（7セグ風・表示専用） =====
     懐かしいキリ番カウンターの見た目：銀〜水色のメタリック枠＋黒い液晶＋蛍光緑の7セグ。 */
  .kiri-hero{ background:linear-gradient(180deg,#f2f6fa 0%,#dde6ee 55%,#cfdae5 100%);
              border-bottom:1px solid #b9c7d4; padding:9px 10px 11px; text-align:center; }
  .kiri-eyebrow{ font-size:11.5px; font-weight:800; letter-spacing:.12em; color:#4b5d6e; }
  .kiri-frame{ display:inline-block; max-width:100%; margin-top:6px; padding:8px 10px; border-radius:13px;
               border:1px solid #728aa0;
               background:linear-gradient(158deg,#ffffff 0%,#dbe6ef 22%,#a8bccd 48%,#7f97ac 62%,#e6eef6 88%,#c3d3e1 100%);
               box-shadow:0 3px 0 #7c93a8, 0 7px 16px rgba(26,47,68,.28), inset 0 1px 0 #fff, inset 0 -1px 0 rgba(0,0,0,.15); }
  .kiri-lcd{ position:relative; overflow:hidden; border-radius:7px; padding:9px 8px 7px;
             border:1px solid #1d3346;
             background:radial-gradient(120% 140% at 50% 0%, #0b1710 0%, #050b08 60%, #020503 100%);
             box-shadow:inset 0 2px 10px #000, inset 0 0 22px rgba(0,255,70,.08); }
  .kiri-lcd::after{ content:""; position:absolute; inset:0; pointer-events:none; border-radius:7px;
             background:linear-gradient(115deg, rgba(255,255,255,.16) 0%, rgba(255,255,255,.04) 26%, rgba(255,255,255,0) 46%); }
  .kiri-seg{ --seg-h:clamp(46px,18vw,92px);
             display:flex; align-items:center; justify-content:center; gap:clamp(3px,1.4vw,9px); }
  /* 桁の比率は viewBox と同じ 100:180 に固定する（画面幅で高さだけ伸縮） */
  .kiri-seg svg{ display:block; flex:0 0 auto; height:var(--seg-h); width:calc(var(--seg-h) * 0.5556);
                 transform:skewX(-5deg); }
  .kiri-seg .off{ fill:#0c2814; }
  .kiri-seg .on{ fill:#19ff4b;
             filter:drop-shadow(0 0 4px rgba(25,255,75,.85)) drop-shadow(0 0 10px rgba(25,255,75,.35)); }
  .kiri-seg.loading .on{ opacity:.22; }
  .kiri-lead{ margin:8px 0 0; font-size:14px; font-weight:700; color:#243342; line-height:1.6; }
  .kiri-num{ display:inline-block; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.08em;
             font-size:13px; background:#0a1710; color:#19ff4b; border-radius:6px; padding:1px 7px;
             box-shadow:inset 0 0 6px rgba(0,255,70,.25); }
  .kiri-sub{ margin:4px 0 0; font-size:12px; color:#3f5162; line-height:1.5; }
  .kiri-note{ margin:3px 0 0; font-size:11px; color:#6b7c8c; line-height:1.5; }
  .kiri-hero.hit .kiri-sub{ color:#1b6b2a; font-weight:700; }
  /* ヘッダーの常時表示は液晶と同じ色味のチップにそろえる */
  .kiri-chip{ flex:0 0 auto; display:inline-flex; align-items:center; gap:4px; font-size:12px; font-weight:700;
              color:#19ff4b; background:#0a1710; border:1px solid #1d3346; border-radius:8px; padding:5px 8px;
              white-space:nowrap; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
              box-shadow:inset 0 0 8px rgba(0,255,70,.18); }
  .kiri-chip b{ font-size:14px; letter-spacing:.06em; }
  .tabs{ display:flex; gap:6px; overflow-x:auto; padding:8px 0 4px; -webkit-overflow-scrolling:touch; }
  .tab{ flex:0 0 auto; border:1px solid var(--line); background:var(--card); color:var(--ink);
        border-radius:999px; padding:8px 12px; font-size:14px; min-height:40px; white-space:nowrap; }
  .tab .cnt{ display:inline-block; margin-left:5px; font-size:12px; font-weight:700;
             color:var(--muted); background:#efe9dc; border-radius:999px; padding:1px 7px; }
  .tab.on{ background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700; }
  .tab.on .cnt{ background:rgba(255,255,255,.28); color:#fff; }
  .tab.zero .cnt{ background:#f2eee5; color:#a49d8d; }
  .filter{ display:flex; align-items:center; gap:6px; overflow-x:auto; padding:6px 0 2px; }
  .filter[hidden]{ display:none; }
  .filter .lab{ flex:0 0 auto; font-size:12px; color:var(--muted); font-weight:600; }
  .filter button{ flex:0 0 auto; border:1px solid var(--line); background:var(--card); color:var(--ink);
        border-radius:999px; padding:7px 13px; font-size:13px; min-height:36px; }
  .filter button.on{ background:var(--ink); border-color:var(--ink); color:#fff; font-weight:700; }
  .filter button .cnt{ display:inline-block; margin-left:4px; font-size:11px; font-weight:700;
        color:var(--muted); background:#efe9dc; border-radius:999px; padding:0 6px; }
  .filter button.on .cnt{ background:rgba(255,255,255,.28); color:#fff; }
  .search{ width:100%; font-size:16px; padding:10px 12px; border:1px solid var(--line);
           border-radius:10px; background:var(--card); margin-top:6px; }
  .legend{ font-size:11.5px; color:var(--muted); margin-top:6px; line-height:1.6; }
  main{ padding:10px 12px 40px; }
  .count{ font-size:13px; color:var(--muted); margin:2px 0 8px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:14px;
         padding:12px; margin-bottom:10px; }
  .card.today{ border:2px solid var(--today); }
  .card.expired{ opacity:.6; }
  .card.busy{ opacity:.7; }
  .cardtop{ display:flex; align-items:center; gap:6px; margin-bottom:6px; }
  .no{ font-size:13px; font-weight:700; color:#fff; background:var(--ink);
       border-radius:8px; padding:3px 9px; letter-spacing:.02em; }
  .name{ font-size:16px; font-weight:700; line-height:1.4; }
  .sub{ font-size:13px; color:var(--muted); margin-top:2px; line-height:1.5; }
  .row{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .chip{ font-size:12px; border-radius:999px; padding:4px 9px; background:#f0ead9; }
  .chip.dl-today{ background:var(--today); color:#fff; font-weight:700; }
  .chip.dl-soon{ background:var(--soon); color:#fff; font-weight:700; }
  .chip.done{ background:var(--ok); color:#fff; }
  .chip.fail{ background:#8e1b1b; color:#fff; font-weight:700; }
  .chip.owner{ background:#e8e2d3; font-weight:700; }
  .detail{ font-size:13px; line-height:1.6; margin-top:8px; }
  .detail b{ color:var(--muted); font-weight:600; }
  .go{ display:block; text-align:center; margin-top:10px; padding:13px; border-radius:12px;
       background:var(--accent); color:#fff; font-size:16px; font-weight:700; text-decoration:none; }
  .go:active{ opacity:.8; }
  .assign{ display:flex; align-items:center; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .assign .lab{ font-size:12px; color:var(--muted); font-weight:600; width:100%; }
  .assign button{ border:1px solid var(--line); background:var(--card); color:var(--ink);
        border-radius:999px; padding:8px 14px; font-size:14px; min-height:38px; }
  .assign button.skip{ color:var(--today); border-color:var(--today); }
  .assign button.skip.cur{ background:var(--today); border-color:var(--today); color:#fff; }
  .assign button.fail{ color:#8e1b1b; border-color:#8e1b1b; }
  .assign button.fail.cur{ background:#8e1b1b; border-color:#8e1b1b; color:#fff; }
  .assign button.unfail{ background:#8e1b1b; border-color:#8e1b1b; color:#fff; font-weight:700; }
  .assign button.capv1{ background:#1565c0; border-color:#1565c0; color:#fff; }
  .assign button.capv2{ background:#fdd835; border-color:#e0bd1d; color:#22201c; }
  .assign button.capv3{ background:#c62828; border-color:#c62828; color:#fff; }
  /* いまの担当は全員そろって「太い黒枠」で示す（色はその人の可否を表すので枠で区別する） */
  .assign button.cur{ outline:3px solid #22201c; outline-offset:1px; font-weight:700; }
  .assign button:active{ opacity:.75; }
  .assign button:disabled{ opacity:.45; }
  .legend .dot{ display:inline-block; width:10px; height:10px; border-radius:50%; margin:0 2px 0 7px; vertical-align:-1px; }
  .toast{ position:fixed; left:12px; right:12px; bottom:14px; z-index:20; display:none;
        background:#22201c; color:#fff; font-size:14px; line-height:1.5; border-radius:12px;
        padding:12px 14px; box-shadow:0 4px 16px rgba(0,0,0,.25); }
  .toast.err{ background:#8e1b1b; }
  .toast button{ margin-top:8px; display:block; width:100%; border:0; border-radius:10px;
        background:#fff; color:#22201c; font-size:14px; font-weight:700; padding:10px; }
  .empty{ text-align:center; color:var(--muted); padding:26px 6px 10px; font-size:14px; line-height:1.7; }
  .empty .links{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:12px; }
  .empty .links button{ border:1px solid var(--line); background:var(--card); color:var(--ink);
        border-radius:999px; padding:9px 14px; font-size:14px; min-height:40px; }
  footer{ font-size:12px; color:var(--muted); text-align:center; padding:0 12px 24px; line-height:1.6; }
</style>
</head>
<body>
<!-- 応募キリ番カウンター：ページの1番上。表示専用で、数字はAPI（/api/counter）から読むだけ。 -->
<section class="kiri-hero" id="kiri">
  <div class="kiri-eyebrow">🎯 応募キリ番カウンター</div>
  <div class="kiri-frame">
    <div class="kiri-lcd">
      <div class="kiri-seg loading" id="kiriSeg" role="img" aria-label="累計応募数の7セグ表示"></div>
    </div>
  </div>
  <p class="kiri-lead">累計応募数は <span class="kiri-num" id="kiriPlain">------</span> 件です！</p>
  <p class="kiri-sub" id="kiriSub">読み込み中…</p>
  <p class="kiri-note" id="kiriNote"></p>
</section>
<header>
  <div class="headrow">
    <h1>懸賞リスト</h1>
    <span class="kiri-chip" id="kiriChip" title="応募キリ番カウンター">🎯 <b id="kiriChipCount">—</b>件</span>
    <button class="refresh" id="refresh" type="button">最新を読み込む</button>
  </div>
  <div class="meta" id="meta">読み込み中…</div>
  <div class="tabs" id="tabs">
    <button class="tab on" data-tab="unassigned" type="button">未振り分け<span class="cnt">-</span></button>
    <button class="tab" data-tab="assigned" type="button">振り分け済み<span class="cnt">-</span></button>
    <button class="tab" data-tab="done" type="button">応募済み<span class="cnt">-</span></button>
    <button class="tab" data-tab="daily" type="button">毎日応募<span class="cnt">-</span></button>
    <button class="tab" data-tab="failed" type="button">× できなかった<span class="cnt">-</span></button>
    <button class="tab" data-tab="skip" type="button">やらない<span class="cnt">-</span></button>
  </div>
  <div class="filter" id="filter" hidden>
    <span class="lab">人別：</span>
    <button type="button" data-filter="全員" class="on">全員<span class="cnt">-</span></button>
    <button type="button" data-filter="本人">本人<span class="cnt">-</span></button>
    <button type="button" data-filter="むぎ">むぎ<span class="cnt">-</span></button>
    <button type="button" data-filter="きなこ">きなこ<span class="cnt">-</span></button>
    <button type="button" data-filter="パッド">パッド<span class="cnt">-</span></button>
  </div>
  <input class="search" id="q" type="search" placeholder="キャンペーン名・主催で検索" autocomplete="off">
  <div class="legend">担当ボタンの色はその人の可否です（むぎ・きなこ・パッド欄）：<span class="dot" style="background:#1565c0"></span>1 できる<span class="dot" style="background:#fdd835"></span>2 たぶんできる<span class="dot" style="background:#c62828"></span>3 できない（色なし＝未入力）／<b>いまの担当は太い黒枠</b></div>
  <div class="legend">「やらない」は確認のうえ「やらない」タブへ移ります。そこでもう一度担当を押せば戻せます。／「× できなかった」は応募しようとしてできなかった案件です（担当はそのまま、「×を解除」で戻せます）。</div>
</header>
<main>
  <div class="count" id="count"></div>
  <div id="list"></div>
</main>
<footer>データ元：データベース（Vercel Storage / Upstash Redis）／応募は公式URL先で行います</footer>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="logic.js"></script>
<script>
"use strict";
// ============ 設定 ============
const CONF = window.SWEEP_CONFIG || {};
const API = CONF.apiBase || "/api/items";
const COUNTER_API = CONF.counterApiBase || "/api/counter";
const PASSCODE = CONF.passcode || "";
const WRITE_TIMEOUT_MS = 10000;

// ============ 小物 ============
function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function safeUrl(u){
  try{ const x = new URL(String(u)); return (x.protocol === "https:" || x.protocol === "http:") ? x.href : ""; }
  catch(e){ return ""; }
}
const LOGIC = window.SWEEP_LOGIC;
function parseDeadline(s){ return LOGIC.parseDeadline(s); }
function daysLeft(dl, now){ return LOGIC.daysLeft(dl, now); }
function two(n){ return n < 10 ? "0" + n : "" + n; }
function fmtTime(iso){
  if(!iso) return "";
  const d = new Date(iso);
  if(isNaN(d)) return "";
  return (d.getMonth()+1) + "/" + d.getDate() + " " + two(d.getHours()) + ":" + two(d.getMinutes());
}

// ============ 状態 ============
let ITEMS = [];
let TAB = "unassigned";
let OWNER_FILTER = "全員";   // 振り分け済み・×タブの人別フィルター
let LOADED = false;
let LAST_UPDATED = null;
let LOAD_ERROR = "";
let COUNTER = null;          // /api/counter の応答（count, initialized, updated_at, updated_by …）
let COUNTER_ERROR = "";
const BUSY = new Set();       // 書き込み中のNo
const TAB_NAMES = LOGIC.TAB_NAMES;
const OWNER_CHOICES = ["本人", "むぎ", "きなこ", "パッド"];
const CAP_LABEL = { "1":"できる", "2":"たぶんできる", "3":"できない" };
const FILTER_TABS = ["assigned", "failed"];

// ============ 振り分け判定（logic.js と共通） ============
function isUnassigned(it){ return LOGIC.isUnassigned(it); }
function isDone(it){ return LOGIC.isDone(it); }
function isDaily(it){ return LOGIC.isDaily(it); }
function isSkip(it){ return LOGIC.isSkip(it); }
function isFailed(it){ return LOGIC.isFailed(it); }
function dailyActive(it){ return LOGIC.dailyActive(it, new Date()); }
function tabOf(it){ return LOGIC.tabOf(it, new Date()); }
function capVal(it, who){
  if(who === "むぎ") return String(it.mugi ?? "").trim();
  if(who === "きなこ") return String(it.kinako ?? "").trim();
  if(who === "パッド") return String(it.pad ?? "").trim();
  return "";
}

// ============ 通信 ============
async function reqAt(base, method, path, body, timeoutMs){
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), timeoutMs || WRITE_TIMEOUT_MS);
  try{
    const opt = { method, cache: "no-store", signal: ctl.signal, headers: {} };
    opt.headers["x-chat-passcode"] = PASSCODE;
    if(body){
      opt.headers["Content-Type"] = "application/json";
      opt.body = JSON.stringify(body);
    }
    const res = await fetch(base + (path || ""), opt);
    let json = null;
    try{ json = await res.json(); }catch(e){ json = null; }
    if(!res.ok || !json || json.ok === false){
      const code = (json && json.error) || ("http_" + res.status);
      const err = new Error((json && json.message) || code);
      err.code = code;
      throw err;
    }
    return json;
  }catch(e){
    if(e && e.name === "AbortError"){ const t = new Error("timeout"); t.code = "timeout"; throw t; }
    throw e;
  }finally{ clearTimeout(timer); }
}
function req(method, path, body, timeoutMs){ return reqAt(API, method, path, body, timeoutMs); }

async function load(quiet){
  if(!quiet) setMeta("読み込み中…");
  try{
    const out = await req("GET", "?include_hidden=1&t=" + Date.now(), null, 12000);
    ITEMS = Array.isArray(out.items) ? out.items : [];
    LAST_UPDATED = out.updated_at || null;
    LOAD_ERROR = "";
    LOADED = true;
    render();
    loadCounter(true);
    if(!quiet) toast("最新の内容にしました（" + ITEMS.length + "件）");
  }catch(e){
    LOAD_ERROR = e.code === "timeout" ? "時間内に応答がありませんでした" : (e.message || "読み込みに失敗しました");
    LOADED = ITEMS.length > 0;
    render();
    loadCounter(true);
    if(!quiet) toast("読み込みに失敗しました：" + LOAD_ERROR, true);
  }
}

// ============ キリ番カウンター ============
async function loadCounter(quiet){
  try{
    const out = await reqAt(COUNTER_API, "GET", "?t=" + Date.now(), null, 12000);
    COUNTER = out;
    COUNTER_ERROR = "";
  }catch(e){
    COUNTER_ERROR = e.code === "timeout" ? "時間内に応答がありませんでした" : (e.message || "読み込みに失敗しました");
    if(!quiet) toast("カウンターを読み込めませんでした：" + COUNTER_ERROR, true);
  }
  renderCounter();
}

// ===== 7セグ表示（表示専用） =====
// 桁は SVG で描く。viewBox 100×180 の中に a〜g のセグメントを置き、
// 点灯（.on）を蛍光緑・消灯（.off）をうっすら暗い緑にして LED らしく見せる。
const SEG_GEO = (function(){
  const T = 14;            // セグメントの太さ
  const B = T * 0.5;       // 端の面取り（45度）
  const h = T / 2;
  function hseg(y){        // 横棒（桁の幅いっぱい x=0〜100、y は中心）
    return "M0," + y + " L" + B + "," + (y - h) + " L" + (100 - B) + "," + (y - h)
      + " L100," + y + " L" + (100 - B) + "," + (y + h) + " L" + B + "," + (y + h) + " Z";
  }
  function vseg(x, y0, y1){ // 縦棒（x は中心、y0〜y1）
    return "M" + x + "," + y0 + " L" + (x + h) + "," + (y0 + B) + " L" + (x + h) + "," + (y1 - B)
      + " L" + x + "," + y1 + " L" + (x - h) + "," + (y1 - B) + " L" + (x - h) + "," + (y0 + B) + " Z";
  }
  return {
    a: hseg(7), g: hseg(90), d: hseg(173),
    f: vseg(7, 14, 83), b: vseg(93, 14, 83),
    e: vseg(7, 97, 166), c: vseg(93, 97, 166),
  };
})();

function digitSvg(ch){
  const lit = LOGIC.sevenSeg(ch);
  let out = '<svg viewBox="0 0 100 180" aria-hidden="true">';
  for(const k of "abcdefg"){
    out += '<path class="' + (lit.indexOf(k) >= 0 ? "on" : "off") + '" d="' + SEG_GEO[k] + '"></path>';
  }
  return out + "</svg>";
}

function segHtml(text){
  return String(text).split("").map(digitSvg).join("");
}

function renderCounter(){
  const seg = document.getElementById("kiriSeg");
  const plain = document.getElementById("kiriPlain");
  const sub = document.getElementById("kiriSub");
  const note = document.getElementById("kiriNote");
  const hero = document.getElementById("kiri");
  const chip = document.getElementById("kiriChipCount");
  if(!seg || !plain || !sub || !note || !hero || !chip) return;

  if(!COUNTER){
    seg.innerHTML = segHtml("------");
    seg.classList.add("loading");
    seg.setAttribute("aria-label", COUNTER_ERROR ? "累計応募数（読み込み失敗）" : "累計応募数（読み込み中）");
    plain.textContent = "------";
    chip.textContent = "—";
    sub.textContent = COUNTER_ERROR ? "読み込み失敗：" + COUNTER_ERROR : "読み込み中…";
    note.textContent = "";
    hero.classList.remove("hit");
    return;
  }

  const n = Math.max(0, Number(COUNTER.count) || 0);
  const text = LOGIC.formatCounter(n);
  seg.innerHTML = segHtml(text);
  seg.classList.remove("loading");
  seg.setAttribute("aria-label", "累計応募数 " + n + " 件（7セグ表示 " + text + "）");
  plain.textContent = text;
  chip.textContent = text;
  hero.classList.toggle("hit", LOGIC.isKiri(n));

  if(LOGIC.isKiri(n)) sub.textContent = "🎉 キリ番 " + n + " 達成！ 次は " + LOGIC.nextKiri(n) + " 件";
  else sub.textContent = "次のキリ番 " + LOGIC.nextKiri(n) + " まであと " + LOGIC.kiriLeft(n) + " 件";

  const bits = [];
  if(!COUNTER.initialized) bits.push("未設定（DBの応募済 " + n + " 件を表示中）");
  const when = fmtTime(COUNTER.updated_at);
  if(when) bits.push("最終更新 " + when + (COUNTER.updated_by ? "（" + COUNTER.updated_by + "）" : ""));
  if(COUNTER_ERROR) bits.push("読み込み失敗：" + COUNTER_ERROR);
  note.textContent = bits.join(" ／ ");
}

function setMeta(text){
  document.getElementById("meta").textContent = text;
}

// ============ 表示 ============
function counts(){
  const c = { unassigned:0, assigned:0, done:0, daily:0, failed:0, skip:0 };
  for(const it of ITEMS) c[tabOf(it)] += 1;
  return c;
}

function renderFilter(){
  const wrap = document.getElementById("filter");
  const show = FILTER_TABS.includes(TAB);
  wrap.hidden = !show;
  if(!show) return;
  wrap.querySelectorAll("button[data-filter]").forEach(b => {
    const who = b.dataset.filter;
    b.classList.toggle("on", who === OWNER_FILTER);
    const badge = b.querySelector(".cnt");
    if(badge) badge.textContent = String(LOGIC.filterByOwner(ITEMS.filter(it => tabOf(it) === TAB), who).length);
  });
}

function renderTabs(c){
  document.querySelectorAll("#tabs .tab").forEach(t => {
    const key = t.dataset.tab;
    t.classList.toggle("on", key === TAB);
    t.classList.toggle("zero", c[key] === 0);
    const badge = t.querySelector(".cnt");
    if(badge) badge.textContent = String(c[key]);
  });
}

function filtered(){
  const now = new Date();
  const q = document.getElementById("q").value.trim();
  let list = LOGIC.decorate(ITEMS, now);
  list = list.filter(it => tabOf(it) === TAB);
  if(FILTER_TABS.includes(TAB)) list = LOGIC.filterByOwner(list, OWNER_FILTER);
  if(q) list = list.filter(it => (String(it.name || "") + " " + String(it.sponsor || "")).includes(q));
  return LOGIC.sortForList(list);
}

function emptyState(c){
  const others = Object.keys(TAB_NAMES).filter(k => k !== TAB && c[k] > 0);
  const links = others.map(k =>
    '<button type="button" data-goto="' + k + '">' + esc(TAB_NAMES[k]) + " " + c[k] + "件</button>"
  ).join("");
  let msg = "";
  if(TAB === "unassigned") msg = "未振り分けは0件です。全件どれかの担当に振り分け済みです。";
  else if(TAB === "assigned") msg = "振り分け済みは0件です。担当を決めた案件がここに出ます。";
  else if(TAB === "done") msg = "応募済みは0件です。";
  else if(TAB === "daily") msg = "毎日応募は0件です（毎日応募欄に○が付いた案件がここに出ます）。";
  else if(TAB === "failed") msg = "×（できなかった）案件はありません。担当ボタン行の「× できなかった」でここに入ります。";
  else if(TAB === "skip") msg = "やらない案件はまだありません。";
  const q = document.getElementById("q").value.trim();
  if(q) msg = "「" + q + "」に一致する案件はこのタブにありません。";
  else if(FILTER_TABS.includes(TAB) && OWNER_FILTER !== "全員") msg = "「" + OWNER_FILTER + "」の案件はこのタブにありません（人別フィルター「全員」で全部見られます）。";
  return '<div class="empty">' + esc(msg) + (links ? '<div class="links">' + links + "</div>" : "") + "</div>";
}

function cardHtml(it){
  const left = it._left;
  const expired = left !== null && left < 0;
  const dlChip = left === null ? '<span class="chip">締切未確認</span>'
    : left === 0 ? '<span class="chip dl-today">今日締切</span>'
    : left > 0 && left <= 3 ? '<span class="chip dl-soon">あと' + left + '日</span>'
    : left > 0 ? '<span class="chip">あと' + left + '日</span>'
    : '<span class="chip">期限切れ</span>';
  const done = isDone(it);
  const url = safeUrl(it.url);
  const busy = BUSY.has(String(it.no));
  const ownerText = String(it.owner || "").trim() || "未振り分け";
  const skipTab = TAB === "skip";
  const buttons = OWNER_CHOICES.map(o => {
    const cv = capVal(it, o);
    const cls = [(CAP_LABEL[cv] ? "capv" + cv : ""), (String(it.owner || "").trim() === o ? "cur" : "")].join(" ").trim();
    const label = o + (CAP_LABEL[cv] ? "（" + CAP_LABEL[cv] + "）" : "");
    return '<button type="button" class="' + cls + '" data-no="' + esc(it.no) + '" data-owner="' + o + '"' + (busy ? " disabled" : "") + '>' + label + "</button>";
  }).join("");
  const skipBtn = '<button type="button" class="skip' + (isSkip(it) ? " cur" : "") + '" data-no="' + esc(it.no) + '" data-owner="やらない"' + (busy ? " disabled" : "") + '>やらない</button>';
  // 「× できなかった」／×タブ内では「×を解除」（担当はそのまま）
  const failBtn = isFailed(it)
    ? '<button type="button" class="unfail" data-no="' + esc(it.no) + '" data-failed=""' + (busy ? " disabled" : "") + '>×を解除</button>'
    : '<button type="button" class="fail" data-no="' + esc(it.no) + '" data-failed="×"' + (busy ? " disabled" : "") + '>× できなかった</button>';
  const assignLabel = skipTab ? "担当に戻す：" : (TAB === "failed" ? "×を解除・担当を変える：" : "担当を決める：");
  return '<article class="card' + (left === 0 ? " today" : "") + (expired ? " expired" : "") + (busy ? " busy" : "") + '">'
    + '<div class="cardtop"><span class="no">No.' + esc(it.no || "-") + "</span></div>"
    + '<div class="name">' + esc(it.name) + "</div>"
    + '<div class="sub">' + esc(it.sponsor) + " ／ " + esc(it.prize) + "</div>"
    + '<div class="row">' + dlChip
    + '<span class="chip">締切 ' + esc(it.deadline) + "</span>"
    + (done ? '<span class="chip done">' + esc(it.status) + "</span>" : '<span class="chip">' + esc(it.status) + "</span>")
    + (isDaily(it) ? '<span class="chip dl-soon">毎日応募 ○</span>' : "")
    + (isFailed(it) ? '<span class="chip fail">× できなかった</span>' : "")
    + '<span class="chip owner">担当：' + esc(ownerText) + "</span>"
    + '<span class="chip">' + esc(it.category) + "</span></div>"
    + (it.user_must && it.user_must !== "なし" && !String(it.user_must).startsWith("なし（")
        ? '<div class="detail"><b>本人がやること：</b>' + esc(it.user_must) + "</div>" : "")
    + (url ? '<a class="go" href="' + esc(url) + '" target="_blank" rel="noopener">公式ページを開く</a>'
           : '<div class="detail"><b>応募先：</b>' + esc(it.url || "URL未設定") + "（ボタンなし）</div>")
    + '<div class="assign"><span class="lab">' + assignLabel + "</span>"
    + buttons + skipBtn + failBtn
    + "</div></article>";
}

function render(){
  const c = counts();
  renderTabs(c);
  renderFilter();
  renderCounter();
  const now = new Date();
  if(LOAD_ERROR){
    setMeta("読み込み失敗：" + LOAD_ERROR);
  }else if(!LOADED){
    setMeta("読み込み中…");
  }else{
    setMeta("全" + ITEMS.length + "件 ／ データベース ／ 更新 " + (fmtTime(LAST_UPDATED) || "—") + " ／ 表示 " + now.toLocaleDateString("ja-JP"));
  }
  const list = filtered();
  const filterNote = FILTER_TABS.includes(TAB) && OWNER_FILTER !== "全員" ? "（" + OWNER_FILTER + "）" : "";
  document.getElementById("count").textContent = TAB_NAMES[TAB] + filterNote + " " + list.length + "件表示";
  const el = document.getElementById("list");
  if(!LOADED){
    el.innerHTML = '<div class="empty">' + (LOAD_ERROR ? "読み込めませんでした：" + esc(LOAD_ERROR) : "読み込み中…")
      + '<div class="links"><button type="button" data-reload="1">もう一度読み込む</button></div></div>';
    return;
  }
  if(!list.length){ el.innerHTML = emptyState(c); return; }
  el.innerHTML = list.map(cardHtml).join("");
}

// ============ トースト ============
let toastTimer = null;
function toast(msg, isErr, retry){
  const el = document.getElementById("toast");
  el.className = "toast" + (isErr ? " err" : "");
  el.innerHTML = esc(msg) + (isErr ? '<button type="button" data-reload="1">最新を読み込み直す</button>' : "");
  el.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.display = "none"; }, isErr ? 8000 : 3200);
}

// ============ 担当の更新 ============
async function setOwner(no, owner, fromSkipTab){
  const key = String(no);
  const it = ITEMS.find(x => String(x.no) === key);
  if(!it || BUSY.has(key)) return;
  if(owner === "やらない" && !isSkip(it)){
    const ok = window.confirm("No." + key + "「" + (it.name || "") + "」を「やらない」にします。\n一覧から外れて「やらない」タブに移ります（あとから戻せます）。");
    if(!ok) return;
  }
  const before = { owner: it.owner };
  BUSY.add(key);
  it.owner = owner;           // 先に画面へ反映（押した瞬間に反応させる）
  render();
  try{
    const out = await req("PATCH", "/" + encodeURIComponent(key), { owner, by: "サイト" }, WRITE_TIMEOUT_MS);
    if(out.item){
      Object.assign(it, out.item);
      LAST_UPDATED = new Date().toISOString();
    }
    BUSY.delete(key);
    render();
    toast("No." + key + " の担当を「" + owner + "」にしました");
  }catch(e){
    // 失敗したら元に戻す（画面だけ変わってDBが変わっていない状態を作らない）
    it.owner = before.owner;
    BUSY.delete(key);
    render();
    const why = whyText(e);
    toast("更新できませんでした：" + why, true);
  }
}

function whyText(e){
  return e.code === "timeout" ? "10秒以内に応答がありませんでした"
    : e.code === "bad_passcode" ? "合言葉が違います（config.js）"
    : e.code === "no_not_found" ? "データベースにそのNoが見つかりませんでした"
    : e.code === "bad_value" ? "値が不正です（×は×か空欄だけ）"
    : (e.message || "通信に失敗しました");
}

// ×（できなかった）の設定・解除。担当（owner）は変えない。
async function setFailed(no, next){
  const key = String(no);
  const it = ITEMS.find(x => String(x.no) === key);
  if(!it || BUSY.has(key)) return;
  if(next === "×" && !isFailed(it)){
    const ok = window.confirm("No." + key + "「" + (it.name || "") + "」を「×（できなかった）」にします。\n「×」タブに移ります（あとから解除できます。担当はそのまま）。");
    if(!ok) return;
  }
  const before = { failed: it.failed };
  BUSY.add(key);
  it.failed = next;           // 先に画面へ反映
  render();
  try{
    const out = await req("PATCH", "/" + encodeURIComponent(key), { failed: next, by: "サイト" }, WRITE_TIMEOUT_MS);
    if(out.item){
      Object.assign(it, out.item);
      LAST_UPDATED = new Date().toISOString();
    }
    BUSY.delete(key);
    render();
    toast(next === "×" ? "No." + key + " を「×（できなかった）」にしました" : "No." + key + " の「×」を解除しました");
  }catch(e){
    it.failed = before.failed;
    BUSY.delete(key);
    render();
    toast("更新できませんでした：" + whyText(e), true);
  }
}

// ============ イベント ============
document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab");
  if(!b) return;
  TAB = b.dataset.tab;
  OWNER_FILTER = "全員";
  document.querySelectorAll("#tabs .tab").forEach(t => t.classList.toggle("on", t === b));
  render();
  renderCounter();
  window.scrollTo({ top: 0, behavior: "smooth" });
});
document.getElementById("filter").addEventListener("click", e => {
  const b = e.target.closest("button[data-filter]");
  if(!b) return;
  OWNER_FILTER = b.dataset.filter;
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
});
document.getElementById("list").addEventListener("click", e => {
  const goto = e.target.closest("button[data-goto]");
  if(goto){
    TAB = goto.dataset.goto;
    OWNER_FILTER = "全員";
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }
  if(e.target.closest("button[data-reload]")){ load(false); return; }
  const b = e.target.closest(".assign button");
  if(!b || b.disabled) return;
  // ×（できなかった）ボタン／×を解除ボタン
  if(b.dataset.failed !== undefined){ setFailed(b.dataset.no, b.dataset.failed); return; }
  setOwner(b.dataset.no, b.dataset.owner, TAB === "skip");
});
document.getElementById("toast").addEventListener("click", e => {
  if(e.target.closest("button[data-reload]")) load(false);
});
document.getElementById("refresh").addEventListener("click", () => load(false));
document.getElementById("q").addEventListener("input", render);

render();
load(true);
</script>
