<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>懸賞リスト（スマホ用）</title>
<style>
  :root{ --bg:#f6f4ef; --card:#fff; --ink:#22201c; --muted:#6f6a5e; --line:#e3ded2;
         --accent:#b3541e; --today:#c62828; --soon:#ef6c00; --ok:#2e7d32; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
        background:var(--bg); color:var(--ink); -webkit-text-size-adjust:100%; }
  header{ position:sticky; top:0; z-index:10; background:var(--bg); padding:10px 12px 6px;
          border-bottom:1px solid var(--line); }
  h1{ font-size:18px; margin:0 0 2px; }
  .meta{ font-size:12px; color:var(--muted); }
  .tabs{ display:flex; gap:6px; overflow-x:auto; padding:8px 0 4px; -webkit-overflow-scrolling:touch; }
  .tab{ flex:0 0 auto; border:1px solid var(--line); background:var(--card); color:var(--ink);
        border-radius:999px; padding:8px 12px; font-size:14px; min-height:40px; }
  .tab.on{ background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700; }
  .search{ width:100%; font-size:16px; padding:10px 12px; border:1px solid var(--line);
           border-radius:10px; background:var(--card); margin-top:6px; }
  main{ padding:10px 12px 40px; }
  .count{ font-size:13px; color:var(--muted); margin:2px 0 8px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:14px;
         padding:12px; margin-bottom:10px; }
  .card.today{ border:2px solid var(--today); }
  .card.expired{ opacity:.55; }
  .cardtop{ display:flex; align-items:center; margin-bottom:6px; }
  .no{ font-size:13px; font-weight:700; color:#fff; background:var(--ink);
       border-radius:8px; padding:3px 9px; letter-spacing:.02em; }
  .name{ font-size:16px; font-weight:700; line-height:1.4; }
  .sub{ font-size:13px; color:var(--muted); margin-top:2px; line-height:1.5; }
  .row{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .chip{ font-size:12px; border-radius:999px; padding:4px 9px; background:#f0ead9; }
  .chip.dl-today{ background:var(--today); color:#fff; font-weight:700; }
  .chip.dl-soon{ background:var(--soon); color:#fff; font-weight:700; }
  .chip.done{ background:var(--ok); color:#fff; }
  .detail{ font-size:13px; line-height:1.6; margin-top:8px; }
  .detail b{ color:var(--muted); font-weight:600; }
  .go{ display:block; text-align:center; margin-top:10px; padding:13px; border-radius:12px;
       background:var(--accent); color:#fff; font-size:16px; font-weight:700; text-decoration:none; }
  .go:active{ opacity:.8; }
  .assign{ display:flex; align-items:center; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .assign .lab{ font-size:12px; color:var(--muted); font-weight:600; }
  .assign button{ border:1px solid var(--line); background:var(--card); color:var(--ink);
        border-radius:999px; padding:8px 14px; font-size:14px; min-height:38px; }
  .assign button.cur{ background:var(--ok); border-color:var(--ok); color:#fff; font-weight:700; }
  .assign button.skip{ color:var(--today); border-color:var(--today); }
  .assign button.skip.cur{ background:var(--today); border-color:var(--today); color:#fff; }
  .assign button.capv1{ background:#1565c0; border-color:#1565c0; color:#fff; }
  .assign button.capv2{ background:#fdd835; border-color:#e0bd1d; color:#22201c; }
  .assign button.capv3{ background:#c62828; border-color:#c62828; color:#fff; }
  .assign button.capv1.cur, .assign button.capv2.cur, .assign button.capv3.cur{ outline:3px solid #22201c; outline-offset:1px; }
  .assign button:active{ opacity:.75; }
  .assign button:disabled{ opacity:.5; }
  .cap{ display:flex; align-items:center; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .cap .lab{ font-size:12px; color:var(--muted); font-weight:600; }
  .capbtn{ border-radius:999px; padding:8px 14px; font-size:14px; min-height:38px; display:inline-flex; align-items:center;
        border:1px solid var(--line); background:var(--card); color:var(--muted); font-weight:700; }
  .capbtn.v1{ background:#1565c0; border-color:#1565c0; color:#fff; }
  .capbtn.v2{ background:#fdd835; border-color:#e0bd1d; color:#22201c; }
  .capbtn.v3{ background:#c62828; border-color:#c62828; color:#fff; }
  .legend{ font-size:12px; color:var(--muted); margin-top:6px; line-height:1.6; }
  .dot{ display:inline-block; width:10px; height:10px; border-radius:50%; margin:0 2px 0 7px; vertical-align:-1px; }
  .toast{ position:fixed; left:12px; right:12px; bottom:14px; z-index:20; display:none;
        background:#22201c; color:#fff; font-size:14px; line-height:1.5; border-radius:12px;
        padding:12px 14px; box-shadow:0 4px 16px rgba(0,0,0,.25); }
  .empty{ text-align:center; color:var(--muted); padding:32px 0; font-size:14px; }
  footer{ font-size:12px; color:var(--muted); text-align:center; padding:0 12px 24px; }
</style>
</head>
<body>
<header>
  <h1>懸賞リスト</h1>
  <div class="meta" id="meta">読み込み中…</div>
  <div class="tabs" id="tabs">
    <button class="tab on" data-tab="unassigned">未振り分け</button>
    <button class="tab" data-tab="assigned">振り分け済み</button>
    <button class="tab" data-tab="done">応募済み</button>
    <button class="tab" data-tab="daily">毎日応募</button>
  </div>
  <input class="search" id="q" type="search" placeholder="キャンペーン名・主催で検索" autocomplete="off">
  <div class="legend">担当ボタンの色は、その人の可否（シートの「むぎ」「きなこ」欄の入力）です：<span class="dot" style="background:#1565c0"></span>1 できる<span class="dot" style="background:#fdd835"></span>2 たぶんできる・未検証<span class="dot" style="background:#c62828"></span>3 絶対にできない（色なし＝未入力）</div>
  <div class="legend">毎日応募：シートの「毎日応募」欄に○が付いたものが「毎日応募」タブに入ります（応募期間中はずっと表示されます）</div>
</header>
<main>
  <div class="count" id="count"></div>
  <div id="list"></div>
</main>
<footer>データ元：Googleスプレッドシート「懸賞_共通応募リスト」／応募は公式URL先で本人が行います</footer>
<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script src="config.js"></script>
<script>
"use strict";
// ---- 締切パース：「2026/11/30 23:59」「2026/12/06」「2026/11/29（…）」等に対応 ----
function parseDeadline(s){
  if(!s) return null;
  const m = String(s).match(/(\d{4})\/(\d{1,2})\/(\d{1,2})(?:\s+(\d{1,2}):(\d{2}))?/);
  if(!m) return null;
  return new Date(+m[1], +m[2]-1, +m[3], +(m[4]||23), +(m[5]||59), 59);
}
function startOfDay(d){ const x=new Date(d); x.setHours(0,0,0,0); return x; }
function daysLeft(dl, now){
  if(!dl) return null;
  return Math.round((startOfDay(dl) - startOfDay(now)) / 86400000);
}
function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function safeUrl(u){
  try{ const x=new URL(String(u)); return (x.protocol==="https:"||x.protocol==="http:") ? x.href : ""; }
  catch(e){ return ""; }
}

let ITEMS = (window.SWEEP_SNAPSHOT && window.SWEEP_SNAPSHOT.items) || [];
ITEMS.forEach((it, i) => { it._row = i + 2; }); // スナップショットはシートの行順どおり生成されている
let SOURCE_LABEL = "スナップショット " + ((window.SWEEP_SNAPSHOT||{}).generated_at || "");
let tab = "unassigned";

// ---- 未振り分け判定：担当が空欄／未振り分け／未定／保留 のもの（担当者が決まってない） ----
function isUnassigned(it){
  const o = String(it.owner || "").trim();
  return o === "" || o === "未振り分け" || o === "未定" || o === "保留" || o === "-" || o === "—";
}
// ---- 応募済み判定：応募状況が「応募済」で始まるもの ----
function isDone(it){
  return String(it.status || "").startsWith("応募済");
}
// ---- 毎日応募判定：シートの「毎日応募」欄（P列）に○が付いているもの ----
function isDaily(it){
  const v = String(it.daily || "").trim();
  return v.includes("○") || v.includes("◯");
}
// ---- 「やらない」判定：担当欄が「やらない」のもの（応募しないと決めた案件） ----
function isSkip(it){
  return String(it.owner || "").trim() === "やらない";
}
// ---- 振り分け先（4分類＋「やらない」はどのタブにも出さない） ----
// 毎日応募：P列に○が付いているもの（担当の有無にかかわらず最優先。
//   応募期間中＝締切当日まで毎日応募タブに表示し続け、締切を過ぎたら通常の分類に戻る）
// 未振り分け：担当者が決まってない／応募済み：担当が決まって応募も完了
// 振り分け済み：担当が決まっているが未応募
function tabOf(it){
  if(isSkip(it)) return "skip";
  if(isDaily(it)){
    const left = daysLeft(parseDeadline(it.deadline), new Date());
    if(left === null || left >= 0) return "daily";
  }
  if(isUnassigned(it)) return "unassigned";
  if(isDone(it)) return "done";
  return "assigned";
}
const OWNER_CHOICES = ["本人", "むぎ", "きなこ"];
// ---- 担当ボタンの色＝その人の可否：シートの むぎ(N列)／きなこ(O列) 欄の入力 1・2・3 で色が変わる ----
// 1=できる（青）／2=たぶんできる・未検証（黄色）／3=絶対にできない（赤）／未入力=色なし
const CAP_LABEL = {"1":"1 できる","2":"2 たぶんできる","3":"3 絶対にできない"};
function capVal(it, who){
  if(who === "むぎ") return String(it.mugi ?? "").trim();
  if(who === "きなこ") return String(it.kinako ?? "").trim();
  return "";
}

let toastTimer = null;
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg; el.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.style.display = "none"; }, 4200);
}

// ---- 担当をシートへ書き込む（中継 endpoint があれば直接更新、なければシートのセルを開く） ----
async function setOwner(no, owner, btn){
  const cfg = window.SWEEP_WRITE || {};
  const it = ITEMS.find(x => String(x.no) === String(no));
  if(cfg.endpoint){
    btn.disabled = true;
    try{
      const res = await fetch(cfg.endpoint, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ passcode: cfg.passcode || "", no: String(no), owner })
      });
      const out = await res.json();
      if(!out.ok) throw new Error(out.error || "update_failed");
      if(it) it.owner = owner;
      toast("担当を「" + owner + "」にしました（シート更新済み）");
      render();
    }catch(e){
      btn.disabled = false;
      toast("シート更新に失敗しました。通信を確認してもう一度押してください");
    }
  }else{
    // フォールバック：中継が未設定の間は、シートの担当セル（M列・その行）を直接開く
    const id = (window.SWEEP_SNAPSHOT||{}).spreadsheet_id;
    const row = it && it._row ? it._row : (parseInt(no, 10) + 1);
    window.open("https://docs.google.com/spreadsheets/d/" + id + "/edit#gid=282030616&range=M" + row, "_blank");
    toast("書き込み中継が未設定のため、シートの担当セルを開きました。そこで「" + owner + "」と入力すると反映されます");
  }
}

// ---- 可能ならライブ取得（シートがリンク共有で読める場合のみ成功。失敗時はスナップショット） ----
async function tryLive(){
  const id = (window.SWEEP_SNAPSHOT||{}).spreadsheet_id;
  if(!id) return;
  try{
    const ctl = new AbortController(); setTimeout(()=>ctl.abort(), 6000);
    const res = await fetch("https://docs.google.com/spreadsheets/d/"+id+"/gviz/tq?tqx=out:json&sheet="+encodeURIComponent("応募リスト"), {signal: ctl.signal});
    const txt = await res.text();
    const json = JSON.parse(txt.substring(txt.indexOf("{"), txt.lastIndexOf("}")+1));
    const cols = ["no","name","sponsor","prize","deadline","decision","category","agent_can","user_must","status","url","evidence","owner","mugi","kinako","daily"];
    const rows = (json.table.rows||[]).map((r, idx) => {
      const o = {};
      cols.forEach((k,i)=>{ const c = r.c && r.c[i]; o[k] = c ? (c.f ?? (c.v==null?"":String(c.v))) : ""; });
      o._row = idx + 2; // シート上の行番号（1行目=見出し）
      return o;
    }).filter(o => o.name);
    if(rows.length >= 10){ ITEMS = rows; SOURCE_LABEL = "ライブ取得（シート連携）"; render(); }
  }catch(e){ /* スナップショットのまま */ }
}

function filtered(){
  const now = new Date();
  const q = document.getElementById("q").value.trim();
  let list = ITEMS.map(it => ({...it, _dl: parseDeadline(it.deadline), _left: null}))
                    .map(it => (it._left = daysLeft(it._dl, now), it));
  list = list.filter(it => tabOf(it) === tab);
  if(q) list = list.filter(it => (it.name+" "+it.sponsor).includes(q));
  list.sort((a,b)=>{
    if(a._dl && b._dl) return a._dl - b._dl;
    if(a._dl) return -1; if(b._dl) return 1; return 0;
  });
  return list;
}

function render(){
  const now = new Date();
  document.getElementById("meta").textContent =
    "全" + ITEMS.length + "件 ／ " + SOURCE_LABEL + " ／ " + now.toLocaleDateString("ja-JP") + " 時点";
  const list = filtered();
  document.getElementById("count").textContent = list.length + "件表示";
  const el = document.getElementById("list");
  if(!list.length){ el.innerHTML = '<div class="empty">該当する懸賞がありません</div>'; return; }
  el.innerHTML = list.map(it => {
    const left = it._left;
    const expired = left !== null && left < 0;
    const dlChip = left === null ? '<span class="chip">締切未確認</span>'
      : left === 0 ? '<span class="chip dl-today">今日締切</span>'
      : left > 0 && left <= 3 ? '<span class="chip dl-soon">あと'+left+'日</span>'
      : left > 0 ? '<span class="chip">あと'+left+'日</span>'
      : '<span class="chip">期限切れ</span>';
    const done = String(it.status||"").startsWith("応募済");
    const url = safeUrl(it.url);
    return '<article class="card'+(left===0?" today":"")+(expired?" expired":"")+'">'
      + '<div class="cardtop"><span class="no">No.'+esc(it.no || "-")+'</span></div>'
      + '<div class="name">'+esc(it.name)+'</div>'
      + '<div class="sub">'+esc(it.sponsor)+' ／ '+esc(it.prize)+'</div>'
      + '<div class="row">'+dlChip
      + '<span class="chip">締切 '+esc(it.deadline)+'</span>'
      + (done ? '<span class="chip done">'+esc(it.status)+'</span>' : '<span class="chip">'+esc(it.status)+'</span>')
      + (isDaily(it) ? '<span class="chip dl-soon">毎日応募 ○</span>' : '')
      + '<span class="chip">担当：'+esc(it.owner)+'</span>'
      + '<span class="chip">'+esc(it.category)+'</span></div>'
      + (it.user_must && it.user_must !== "なし" && !String(it.user_must).startsWith("なし（")
          ? '<div class="detail"><b>本人がやること：</b>'+esc(it.user_must)+'</div>' : '')
      + (url ? '<a class="go" href="'+esc(url)+'" target="_blank" rel="noopener">公式ページを開く</a>'
             : '<div class="detail"><b>応募先：</b>'+esc(it.url || "URL未設定")+'（ボタンなし）</div>')
      + '<div class="assign"><span class="lab">担当を決める：</span>'
      + OWNER_CHOICES.map(o => {
          const cv = capVal(it, o);
          const cls = (CAP_LABEL[cv] ? 'capv' + cv + ' ' : '') + (String(it.owner||"").trim() === o ? 'cur' : '');
          const label = o + (CAP_LABEL[cv] ? '（' + cv + '）' : '');
          return '<button type="button" class="' + cls.trim() + '" data-no="'+esc(it.no)+'" data-owner="'+o+'">' + label + '</button>';
        }).join("")
      + '<button type="button" class="skip'+(isSkip(it) ? ' cur' : '')+'" data-no="'+esc(it.no)+'" data-owner="やらない">やらない</button>'
      + '</div>'
      + '</article>';
  }).join("");
}

document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab"); if(!b) return;
  tab = b.dataset.tab;
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t === b));
  render();
});
document.getElementById("list").addEventListener("click", e => {
  const b = e.target.closest(".assign button"); if(!b) return;
  setOwner(b.dataset.no, b.dataset.owner, b);
});
document.getElementById("q").addEventListener("input", render);
render();
tryLive();
</script>
</body>
</html>
